[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "package-monitor"
dynamic = ["version"]
description = "A lightweight PySide6 desktop monitor that tracks Cainiao and express deliveries with login, tray notifications and a card-based UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shifu-HU", email = "Shifu-HU@users.noreply.github.com" }]
keywords = ["cainiao", "package", "parcel", "tracking", "express", "desktop", "pyside6", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Shifu-HU/package-monitor"
Repository = "https://github.com/Shifu-HU/package-monitor"
Issues = "https://github.com/Shifu-HU/package-monitor/issues"

[project.scripts]
package-monitor = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "package_monitor",
    "package_monitor.api",
    "package_monitor.core",
    "package_monitor.ui",
]

[tool.setuptools.dynamic]
version = { attr = "package_monitor.__version__" }
